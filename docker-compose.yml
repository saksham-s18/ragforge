services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: ragforge-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  qdrant_storage:
    name: ragforge_qdrant_storage
